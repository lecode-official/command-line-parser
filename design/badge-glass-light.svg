<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200">
<defs>
 <linearGradient id="bgg_L" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#efeaff"></stop><stop offset="0.3" stop-color="#eae1ff"></stop><stop offset="0.55" stop-color="#e6dbff"></stop><stop offset="0.8" stop-color="#efe4fa"></stop><stop offset="1" stop-color="#f4ecfb"></stop></linearGradient>
 <linearGradient id="sheen_L" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.7"></stop><stop offset="0.26" stop-color="#fff" stop-opacity="0.252"></stop><stop offset="0.52" stop-color="#fff" stop-opacity="0"></stop></linearGradient>
 <clipPath id="bC_L"><rect x="8" y="8" width="184" height="184" rx="52"></rect></clipPath>
 <clipPath id="pC_L"><rect x="30" y="30" width="140" height="140" rx="40"></rect></clipPath>
 <filter id="frost_L" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"></feGaussianBlur></filter>
 <filter id="blob_L" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="20"></feGaussianBlur></filter>
 <filter id="glow_L" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4"></feGaussianBlur></filter>
 <filter id="pshadow_L" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"></feGaussianBlur></filter>
 <filter id="inDark_L" x="-40%" y="-40%" width="180%" height="180%"><feOffset in="SourceAlpha" dx="5" dy="-6" result="o"></feOffset><feGaussianBlur in="o" stdDeviation="9" result="b"></feGaussianBlur><feComposite in="SourceAlpha" in2="b" operator="out" result="inv"></feComposite><feFlood flood-color="#6a4bb5" flood-opacity="0.16"></feFlood><feComposite in2="inv" operator="in"></feComposite></filter>
 <filter id="inGlow_L" x="-40%" y="-40%" width="180%" height="180%"><feOffset in="SourceAlpha" dx="0" dy="7" result="o"></feOffset><feGaussianBlur in="o" stdDeviation="6" result="b"></feGaussianBlur><feComposite in="SourceAlpha" in2="b" operator="out" result="inv"></feComposite><feFlood flood-color="#ffffff" flood-opacity="0.65"></feFlood><feComposite in2="inv" operator="in"></feComposite></filter>
 <filter id="noise_L" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="1.7" numOctaves="1" stitchTiles="stitch" result="n"></feTurbulence><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.005 -0.0025"></feColorMatrix></filter>
 <g id="bg_L"><rect x="8" y="8" width="184" height="184" rx="52" fill="url(#bgg_L)"></rect><circle cx="150" cy="42" r="70" fill="#c9b6ff" opacity="0.75" filter="url(#blob_L)"></circle><circle cx="46" cy="164" r="64" fill="#9db8ff" opacity="0.55" filter="url(#blob_L)"></circle></g>
</defs>
  <g clip-path="url(#bC_L)"><use xlink:href="#bg_L" href="#bg_L"></use></g>
  <g clip-path="url(#bC_L)"><rect x="30" y="35" width="140" height="140" rx="40" fill="#5a3ca0" opacity="0.2" filter="url(#pshadow_L)"></rect></g>
